<!doctype html>
<html lang="pt-BR" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savio Cavalcante · Design, edição, motion e web</title>
<meta name="description" content="Portfólio de Savio Cavalcante: designer, editor de vídeo, motion designer e web designer.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<link rel="stylesheet" href="../../shared/base.css">
<link rel="stylesheet" href="../cenas.css">
<link rel="stylesheet" href="b.css">
<script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
</head>
<body>

<header class="hud hud-top">
  <button class="mark" type="button" data-home data-t-attr="aria-label:ui.home">
    <span class="mark-text">SC</span>
  </button>
  <div class="hud-actions">
    <button type="button" data-lang-toggle data-t-attr="aria-label:ui.lang"><span data-t="ui.langShort">EN</span></button>
    <button type="button" data-motion-toggle class="motion-toggle"><span data-t="ui.motion">Animação</span></button>
    <button type="button" data-map-toggle aria-pressed="false"><span data-map-label data-t="ui.map">Mapa</span></button>
  </div>
</header>

<main class="viewport" id="viewport">
  <canvas class="ground" aria-hidden="true"></canvas>
  <div class="world" id="world">

  <section class="region" data-scene="title" data-hash="apresentacao" aria-labelledby="t-intro">
      <div class="frame frame--title">
        <canvas class="title-light" aria-hidden="true"></canvas>
        <h1 class="name" id="t-intro">
          <span class="name-line" data-fit>Savio</span>
          <span class="name-line" data-fit>Cavalcante</span>
        </h1>
        <div class="title-sub">
          <p class="roles" aria-hidden="true"><span class="cells"></span></p>
          <p class="sr-only" data-roles-text></p>
          <p class="lead" data-t="v1.lead"></p>
          <p class="title-play"><span class="title-box" data-no-drag data-t="v1.box"></span></p>
        </div>
        <p class="title-hint" data-hint></p>
      </div>
  </section>

  <section class="region" data-scene="design" data-hash="design" aria-labelledby="t-design">
      <div class="frame frame--design">
        <canvas class="lattice" aria-hidden="true"></canvas>
        <div class="design-copy">
          <h2 class="chapter-title" id="t-design" data-t="v1.design.title">Design</h2>
          <p class="chapter-line design-claim" data-t="v1.design.claim">A arte de brincar com o:</p>
          <button type="button" class="caos" data-caos aria-pressed="false"></button>
          <p class="chapter-caption design-caption" data-t="v1.design.caption"></p>
        </div>
        <div class="monitor-area">
          <div class="monitor">
            <span class="m-safe" aria-hidden="true"></span>
            <span class="m-third m-third--v1" aria-hidden="true"></span><span class="m-third m-third--v2" aria-hidden="true"></span>
            <span class="m-third m-third--h1" aria-hidden="true"></span><span class="m-third m-third--h2" aria-hidden="true"></span>
            <svg class="m-blob" viewBox="-1 -1 2 2" aria-hidden="true" focusable="false"><defs><clipPath id="m-blob-clip"><path d=""/></clipPath></defs><path class="m-blob-fill" d=""/><image class="m-blob-img" clip-path="url(#m-blob-clip)" preserveAspectRatio="none"/></svg>
            <canvas class="m-shapes" aria-hidden="true"></canvas>
            <span class="m-bar" aria-hidden="true"></span>
            <span class="m-words" aria-hidden="true"></span>
            <span class="m-text" aria-hidden="true" data-t="v1.design.sub"></span>
            <span class="m-ratio" aria-hidden="true">16:9</span>
            <span class="m-handle" role="slider" tabindex="0" data-no-drag data-no-keys aria-valuemin="0.5" aria-valuemax="2.2" data-t-attr="aria-label:v1.design.handle"></span>
          </div>
          <p class="sr-only" data-t="v1.design.sr"></p>
        </div>
      </div>
  </section>

  <section class="region" data-scene="play" data-hash="interacao" aria-labelledby="t-play">
      <div class="frame frame--play">
        <canvas class="play-bg" aria-hidden="true"></canvas>
        <div class="play-copy">
          <h2 class="chapter-title" id="t-play" data-t="v1.play.title">Colorir é uma dança</h2>
          <p class="chapter-line" data-t="v1.play.line">E a interação é o que cria a experiência</p>
        </div>
        <div class="graph-wrap" data-no-drag-mouse>
          <svg class="graph" viewBox="-0.22 -0.32 1.44 1.64" role="group" data-t-attr="aria-label:v1.play.graph">
            <rect class="graph-box" x="0" y="0" width="1" height="1"/>
            <g class="graph-grid"></g>
            <line class="graph-arm graph-arm--1" x1="0" y1="1" x2="0" y2="1"/>
            <line class="graph-arm graph-arm--2" x1="1" y1="0" x2="1" y2="0"/>
            <path class="graph-curve" d=""/>
            <circle class="graph-rider" r="0.018" cx="0" cy="1"/>
            <circle class="graph-ring" r="0"/>
            <circle class="graph-ring" r="0"/>
            <g class="graph-handle" data-h="1" tabindex="0" role="slider" data-no-keys aria-valuemin="0" aria-valuemax="1">
              <circle class="graph-hit" r="0.08"/><circle class="graph-knob" r="0.028"/>
            </g>
            <g class="graph-handle" data-h="2" tabindex="0" role="slider" data-no-keys aria-valuemin="0" aria-valuemax="1">
              <circle class="graph-hit" r="0.08"/><circle class="graph-knob" r="0.028"/>
            </g>
          </svg>
          <span class="graph-grip" data-h="1" data-no-drag aria-hidden="true"></span>
          <span class="graph-grip" data-h="2" data-no-drag aria-hidden="true"></span>
        </div>
        <div class="play-tools">
          <div class="presets" role="group" data-t-attr="aria-label:v1.play.presets">
            <button type="button" data-preset="linear" data-t="v1.curve.linear">Linear</button>
            <button type="button" data-preset="soft" data-t="v1.curve.soft">Suave</button>
            <button type="button" data-preset="out" data-t="v1.curve.out">Saída</button>
            <button type="button" data-preset="back" data-t="v1.curve.back">Elástico</button>
          </div>
          <div class="channels" aria-hidden="true">
            <p class="channels-head" data-t="v1.play.channels">Canais</p>
            <div class="ch" data-ch="0"><span class="ch-key">R</span><span class="ch-bar"><i></i></span><span class="ch-val">000</span></div>
            <div class="ch" data-ch="1"><span class="ch-key">G</span><span class="ch-bar"><i></i></span><span class="ch-val">000</span></div>
            <div class="ch" data-ch="2"><span class="ch-key">B</span><span class="ch-bar"><i></i></span><span class="ch-val">000</span></div>
          </div>
          <p class="play-note" data-t="b.play.note"></p>
        </div>
      </div>
  </section>

  <section class="region" data-scene="works" data-hash="trabalhos" aria-labelledby="t-works">
      <div class="frame frame--works">
        <div class="onion">
          <svg class="onion-svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid meet">
            <path class="onion-path" d="" aria-hidden="true"/>
            <path class="onion-run" d="" pathLength="1000" aria-hidden="true"/>
            <g class="onion-ghosts" aria-hidden="true"></g>
            <circle class="onion-dot" r="24" cx="0" cy="0" aria-hidden="true"/>
          </svg>
        </div>
        <div class="folders" data-no-drag></div>
        <div class="works-copy">
          <h2 class="chapter-title" id="t-works" data-t="ch.works">Trabalhos recentes</h2>
          <p class="works-readout" aria-hidden="true"><span class="readout-count"></span><span class="readout-work"></span></p>
        </div>
        <p class="sr-only" data-t="v1.works.sr"></p>
      </div>
  </section>

  <div class="reels" data-works></div>

  <section class="region" data-scene="close" data-hash="contato" aria-labelledby="t-close">
      <div class="frame frame--credits">
        <canvas class="kgrid" aria-hidden="true"></canvas>
        <div class="credits">
          <div class="credits-photo" data-photo></div>
          <h2 class="credits-title" id="t-close" data-t="ch.close">Onde me encontrar</h2>
          <ul class="credits-list" data-socials></ul>
          <p class="credits-name">Savio Cavalcante</p>
          <p class="credits-roles" data-roles-line></p>
        </div>
      </div>
  </section>

  </div>
</main>

<nav class="hud hud-bottom" data-t-attr="aria-label:ui.chapters">
  <ol class="index" data-index></ol>
  <span class="timecode" aria-hidden="true">00:00:00:00</span>
  <div class="jog" role="slider" tabindex="0" data-no-drag data-t-attr="aria-label:b.jog" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <svg viewBox="-50 -50 100 100" aria-hidden="true" focusable="false"></svg>
  </div>
</nav>

<div class="grain" aria-hidden="true"></div>

<script src="../../shared/content.js"></script>
<script>SITE.assets = '../../assets/';</script>
<script src="../../shared/site.js"></script>
<script src="../../v1-contagem/mesh.js"></script>
<script src="../../v1-contagem/kinetic.js"></script>
<script src="../../v1-contagem/lattice.js"></script>
<script src="../../v1-contagem/shapes.js"></script>
<script src="../cenas.js"></script>
<script src="b.js"></script>
</body>
</html>
